# agent-deck-autopilot configuration. Copy to ~/.config/agent-deck-autopilot.conf
# and edit. Plain shell syntax; sourced by both the hook and the housekeeping
# script. Everything here is optional.

# Tracker project key for ticket detection. With a prefix set, "abc 12345" style
# variants match case-insensitively ("myproj-123", "MYPROJ123"). Without one,
# only explicit upper-case keys like "ABC-123" are detected in prompts.
#AGENTDECK_TICKET_PREFIX="MYPROJ"

# Ordered grouping rules: "group=regex;group=regex". First match on the
# combined title+branch+prompts text (lower-cased) wins. Groups must already
# exist in agent-deck (agent-deck group create <name>). Keep these narrow and
# high-precision: the model fallback below is what handles the rest.
#AGENTDECK_GROUP_RULES='ops=incident|outage|crash|on.?call|pager;meta=agent.?deck|wrap.?up|housekeeping'

# Fallback group for ticketed sessions that match no rule.
#AGENTDECK_TICKET_GROUP="delivery"

# The taxonomy, in words. When no rule and no ticket places a session,
# agent-deck-group-session shows this list to a small model along with the
# session's standing note and asks which group it belongs in. Without it there
# is no model fallback, and sessions whose titles are one word ("sweep",
# "dependabot") never get filed. Groups named here are also the set this tool
# considers its own: a session sitting in any other group was put there by you
# and is left alone.
#AGENTDECK_GROUP_DESCRIPTIONS='delivery=shipping a ticketed change;ops=production incidents and errors;meta=work on the tooling itself'
#AGENTDECK_AUTOGROUP=1
#AGENTDECK_GROUP_MODEL="claude-haiku-4-5-20251001"
#AGENTDECK_GROUP_MIN_TURNS=2   # turns before the note is worth asking about

# Command taking a ticket key and printing its summary. With this set, a
# ticketed session is titled "KEY-123 what the ticket is about" instead of
# "KEY-123", which is the difference between a deck you can read and a list of
# numbers. Only titles this tool wrote itself are ever replaced; rename a
# session by hand and it stays renamed.
#AGENTDECK_TICKET_TITLE_CMD="my-ticket-summary"
#AGENTDECK_TITLE_MAX=30   # characters of summary to keep

# Unticketed sessions are titled by asking a cheap model to describe the work,
# reading the standing note. Once per session, after it has enough turns to be
# worth naming.
#AGENTDECK_AUTONAME=1
#AGENTDECK_NAME_MODEL="claude-haiku-4-5-20251001"
#AGENTDECK_NAME_MIN_TURNS=3

# Housekeeping thresholds.
#IDLE_DAYS=7            # stale after this many days without activity
#DEAD_DAYS=14           # purge dead (no tmux) sessions after this many days
#WRAP_LIMIT=3           # max wrap-ups per run (each one costs a Claude turn)
#WRAP_TIMEOUT_MIN=25    # give up waiting on a wrap-up after this long
#WRAP_COMMAND="/wrap-up" # slash command sent to stale sessions

# How many stale sessions survive a weekly sweep for you to decide on. The
# rest are wrapped up (idle ones, within WRAP_LIMIT) and archived. Set
# ARCHIVE_UNRANKED=0 to be told about them instead, which is the old
# behaviour and the reason the list used to grow.
#RANK_KEEP=3
#ARCHIVE_UNRANKED=1

# Where standing session notes live, and how long the state files of retired
# sessions are kept. A .sid file is the only link from a deck session to its
# Claude transcript, so these are archived rather than deleted.
#AGENTDECK_NOTES_DIR="$HOME/.local/share/agent-deck-autopilot/sessions"
#STATE_ARCHIVE_DAYS=180

# Optional. Command taking a ticket key and printing its status, used to rank
# a stale session by whether its ticket is still open. Anything containing
# "closed", "done", "released" or "resolved" counts as closed; "open", "in
# progress", "review", "backlog" or "to do" counts as open; anything else is
# treated as no opinion. Unset means ranking falls back to git and PR state.
#TICKET_STATUS_CMD="my-ticket-status"

# Notifier: any command accepting --title, --text and --subtle. Unset means
# the summary only goes to ~/Library/Logs/agent-deck-housekeeping.log.
#NOTIFY_CMD="my-chat-notify"

# Agent Deck profile to operate on.
#AGENTDECK_PROFILE="default"
